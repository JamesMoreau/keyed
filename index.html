<!DOCTYPE html>
<html>
  <head>
    <title>Keyed Website</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <!-- <link rel="stylesheet" type="text/css" href="style.css" /> -->
    <style>
      body {
        font-family: "Consolas";
        font-size: 18px;
        width: 750px;
        height: auto;
        margin: 50px auto;
        color: #333333;
        background-color: lemonchiffon;
      }

      .container {
        border: gold;
        border-width: 5px;
      }

      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      input[type="text"] {
        border-radius: 5px;
        padding: 10px;
        height: 40px;
        width: 400px;
        font-size: 20px;
        font-weight: bold;
        font-family: "Consolas";
      }

      input[type="number"] {
        border-radius: 5px;
        padding: 10px;
        height: 40px;
        font-size: 20px;
        font-weight: bold;
        font-family: "Consolas";
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        height: 30px;
        width: 40px;
      }

      input[type="range"] {
        width: 200px;
      }

      .styled-button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        color: #333333;
        border-radius: 5px;
        background-color: white;
        font-family: "Consolas";
      }

      .styled-button:hover {
        background-color: rgb(160, 160, 160);
      }

      .checkbox-container {
        margin: 5px;
        display: flex;
        align-items: center;
      }

      .my-container {
        background-color: lightgray;
        border: 1px solid #333333;
        border-radius: 5px;
        padding: 20px;
      }

      #parent > * {
        margin: 10px 0;
      }
    </style>
  </head>

  <body>
    <script src="wasm_exec.js"></script>
    <script>
      function updateNumberValue(value) {
        document.getElementById("lengthNumberInput").value = value;
      }

      function updateRangeValue(value) {
        document.getElementById("lengthRangeInput").value = value;
      }

      function copyPassword() {
        passwordInput = document.getElementById("PASS");

        password = passwordInput.value;
        navigator.clipboard.writeText(password);
      }

      // WASM stuff
      const goWasm = new Go();

      WebAssembly.instantiateStreaming(
        fetch("main.wasm"),
        goWasm.importObject
      ).then((result) => {
        goWasm.run(result.instance);
      });

      function generatePasswordFromInput() {
        length = document.getElementById("lengthNumberInput").value;
        includeUppercaseLettersInput = document.getElementById("CB0").checked;
        includeDigitsInput = document.getElementById("CB1").checked;
        includeSpecialCharactersInput = document.getElementById("CB2").checked;
        excludeAmbiguousCharactersInput =
          document.getElementById("CB3").checked;

        passwordInput = document.getElementById("PASS");
        password = generatePassword(
          length,
          includeUppercaseLettersInput,
          includeDigitsInput,
          includeSpecialCharactersInput,
          excludeAmbiguousCharactersInput
        );
        passwordInput.value = password;
      }
    </script>

    <div class="my-container" id="parent">
      <h1 class="title">Keyed - A Simple Password Generator</h1>

      <div>
        Length
        <input
          type="number"
          id="lengthNumberInput"
          min="1"
          max="48"
          step="1"
          value="16"
          oninput="updateRangeValue(this.value)"
          style="margin-right: 10px"
        />
        <input
          type="range"
          id="lengthRangeInput"
          min="1"
          max="48"
          step="1"
          value="16"
          oninput="updateNumberValue(this.value)"
        />
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="CB0" class="checkbox" checked />
        <label for="CB0">Include Uppercase Letters</label>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="CB1" class="checkbox" checked />
        <label for="CB1">Include Digits</label>
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="CB2" class="checkbox" />
        <label for="CB2"
          >Include Special Characters ('&', '*', '+', '/', ...)</label
        >
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="CB3" class="checkbox" />
        <label for="CB3"
          >Exclude Ambiguous Characters ('l', 'L', 'O', '1', ...)</label
        >
      </div>

      <div>
        <form>
          <label>Password </label>
          <input
            type="text"
            id="PASS"
            value=""
            style="margin-right: 5px; width: 536px"
          />
        </form>
      </div>

      <div style="display: flex; justify-content: center">
        <button class="styled-button" onclick="copyPassword()">Copy</button>
        <button class="styled-button" onclick="generatePasswordFromInput()">
          Generate
        </button>
      </div>
    </div>
  </body>

  <footer style="display: flex; justify-content: center">
    <p>
      WASM Required - <a href="https://www.github.com/JamesMoreau">Github</a>
    </p>
  </footer>
</html>
